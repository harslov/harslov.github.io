/* ============================================================
   卫红易666 · shared design system

:root {
  --bg: #060911;
  --bg-2: #0a1120;
  --ink: #eef3fb;
  --muted: #9aa8c2;

  --line: rgba(148, 163, 184, .16);

  --nav-h: 72px;

}

.page-forum { --a: #a78bfa; --b: #f472b6; --c: #22d3ee; }
.page-cs2    { --a: #fb923c; --b: #facc15; --c: #f43f5e; }
.page-about  { --a: #22d3ee; --b: #34d399; --c: #60a5fa; }

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",

  font-size: 16px;

  text-rendering: optimizeLegibility;

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

::selection { background: rgba(34, 211, 238, .30); color: #fff; }

::-webkit-scrollbar { width: 10px; height: 10px; }

  white-space: nowrap;

/* ---------- background ---------- */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;

  background:

    radial-gradient(1000px 700px at -8% 4%, rgba(52, 211, 153, .10), transparent 58%),
    radial-gradient(900px 680px at 52% 112%, rgba(167, 139, 250, .09), transparent 60%),
    linear-gradient(180deg, #060911 0%, #070c16 46%, #05070d 100%);
}
.bg::before {
  content: "";
  position: absolute;
  inset: 0;

    linear-gradient(rgba(148, 163, 184, .052) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .052) 1px, transparent 1px);
  background-size: 74px 74px;

  mix-blend-mode: overlay;

.orb {

  mix-blend-mode: screen;
  animation: drift 24s ease-in-out infinite alternate;
}
.orb-1 {
  width: 54vw; height: 54vw;

}

.site { position: relative; z-index: 2; }

.container {

/* ---------- scroll / cursor / skip ---------- */
.scroll-progress {
  position: fixed;

  z-index: 1;

  margin-left: -270px; margin-top: -270px;
  border-radius: 50%;

  opacity: 0;

  filter: blur(8px);
  transition: opacity .4s;

  content: "";

.nav-links a {

/* ---------- shared type ---------- */
.eyebrow {
  display: inline-flex;

    background-clip: text;
    -webkit-text-fill-color: transparent;

.section-kicker {
  display: flex;

}
.section-kicker::before {

  width: 38px; height: 1px;

  background: var(--grad);
}

/* ---------- home hero ---------- */
.hero { position: relative; padding: clamp(48px, 8vw, 104px) 0 26px; }

  display: grid;

.hero-copy { min-width: 0; }

  margin: 0 0 30px;

}
.random-name a {
  display: inline-flex;

.random-name a::after {
  content: "↗";

.selfie-stage { position: relative; min-width: 0; }
.selfie-halo {
  position: absolute;

  z-index: 0;

}
.selfie-card {
  --rx: 0deg;
  --ry: 0deg;
  position: relative;
  z-index: 1;
  margin: 0;

  transform: perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry)) rotate(1.4deg);

  transition: transform .35s var(--ease), box-shadow .35s;

}

  width: 100%;

.selfie-media img { transform: scale(1.035); filter: saturate(1.06); }
.selfie-media::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  position: absolute;

  background: linear-gradient(180deg, transparent, rgba(34, 211, 238, .16), transparent);

  pointer-events: none;

  position: absolute;
  top: 14px; right: 14px;
  z-index: 4;

  border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 50%;
  background: rgba(6, 10, 18, .55);
  color: #fff;

.zoom-fab svg { width: 17px; height: 17px; }
.selfie-card figcaption {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 13px 8px 3px;

}
.selfie-card figcaption a { color: var(--muted); transition: color .25s; }
.selfie-card figcaption a:hover { color: var(--ink); }

  color: var(--muted);
  font-size: 15px;
  letter-spacing: .01em;
}

/* ---------- forum grid ---------- */
.guest-section { padding: 18px 0 10px; }
.guest-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  align-items: start;
}
.guest-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    linear-gradient(165deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .014));
  box-shadow: 0 22px 60px -42px rgba(0, 0, 0, .95);
  transition: transform .45s var(--ease), border-color .3s, box-shadow .45s;
}
.guest-card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .08) 50%, transparent 65%);
  transform: translateX(-130%);
  transition: transform .9s var(--ease);
}
.guest-card:hover {
  transform: translateY(-8px);
  border-color: rgba(167, 139, 250, .45);
  box-shadow: 0 36px 80px -38px rgba(0, 0, 0, .98), 0 0 50px -30px rgba(244, 114, 182, .45);
}
.guest-card:hover::after { transform: translateX(130%); }
.guest-media { padding: 12px 12px 0; }
.shot-btn {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 18px;
  background: #08101d;
  color: inherit;
  cursor: zoom-in;
  text-align: inherit;
}
.shot-btn > img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .8s var(--ease), filter .5s;
}
.guest-card:hover .shot-btn > img { transform: scale(1.055); filter: saturate(1.08); }
.shot-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 48%, rgba(4, 8, 16, .78));
}
.shot-badge {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 2;
  padding: 4px 8px;
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 7px;
  background: rgba(4, 8, 16, .5);
  color: rgba(255, 255, 255, .82);
  font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: .16em;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.shot-caption {
  position: absolute;
  left: 12px; right: 12px; bottom: 12px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.shot-caption .tag {
  border-color: rgba(255, 255, 255, .22);
  background: rgba(4, 8, 16, .52);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.shot-open {
  color: rgba(255, 255, 255, .68);
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.guest-info { padding: 18px 20px 22px; }
.guest-name {
  margin: 0 0 6px;
  color: var(--ink);
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: .01em;
}
.guest-quote {
  margin: 0;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.guest-quote + .guest-link { margin-top: 10px; }
.guest-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--a);
  font-size: 12.5px;
  font-weight: 600;
}
.guest-link:hover { color: var(--ink); }

/* profile fallback (bangumi avatars) */
.profile-link { cursor: pointer; }
.avatar-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .16), transparent 55%),
    linear-gradient(145deg, rgba(167, 139, 250, .38), rgba(34, 211, 238, .22) 55%, rgba(244, 114, 182, .30));
  color: rgba(255, 255, 255, .92);
  font-size: clamp(42px, 7vw, 66px);
  font-weight: 900;
  letter-spacing: -.04em;
}
.profile-link > img {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .35s, transform .8s var(--ease);
}
.img-failed .profile-link > img { opacity: 0; }
.guest-card:hover .profile-link > img { transform: scale(1.04); }

/* ---------- comments ---------- */
.comments {
  position: relative;
  max-width: 920px;
  margin: clamp(34px, 6vw, 64px) auto clamp(60px, 9vw, 92px);
  padding: clamp(24px, 4vw, 42px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) + 6px);
  background:
    radial-gradient(620px 250px at 100% 0%, rgba(167, 139, 250, .14), transparent 62%),
    linear-gradient(160deg, rgba(15, 23, 42, .88), rgba(8, 13, 26, .72));
  box-shadow: var(--shadow);
}
.comments::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(130deg, rgba(167, 139, 250, .45), transparent 32%, transparent 68%, rgba(34, 211, 238, .35));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: .55;
}
.comments-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.comments-head h2 {
  margin: 0;
  font-size: clamp(1.35rem, 2.7vw, 2rem);
  font-weight: 900;
  letter-spacing: -.02em;
}
.count-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .04em;
}
.comment-form { display: flex; flex-direction: column; gap: 12px; }
.comment-box {
  width: 100%;
  min-height: 116px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(4, 8, 16, .55);
  color: var(--ink);
  font: inherit;
  line-height: 1.75;
  resize: vertical;
  outline: none;
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.comment-box::placeholder { color: rgba(154, 168, 194, .62); }
.comment-box:focus {
  border-color: rgba(34, 211, 238, .55);
  background: rgba(4, 8, 16, .72);
  box-shadow: 0 0 0 4px rgba(34, 211, 238, .10);
}
.form-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--faint);
  font-size: 12px;
}
.form-status { min-height: 1.2em; }
.form-status.is-error { color: #fda4af; }
.form-status.is-ok { color: var(--a); }
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  overflow: hidden;
  border: 0;
  border-radius: 999px;
  background: var(--grad);
  color: #071018;
  font-weight: 900;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 0 12px 30px -14px var(--b);
  transition: transform .25s, filter .25s, box-shadow .25s;
}
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.07); }
.btn-primary:disabled { opacity: .58; cursor: wait; transform: none; }
.btn-primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .45) 50%, transparent 62%);
  transform: translateX(-130%);
  transition: transform .7s var(--ease);
}
.btn-primary:hover::after { transform: translateX(130%); }
.comment-list {
  display: grid;
  gap: 12px;
  margin: 22px 0 0;
  padding: 0;
  list-style: none;
}
.comment-list li {
  padding: 15px 18px;
  border: 1px solid var(--line);
  border-left: 2px solid rgba(167, 139, 250, .75);
  border-radius: 14px;
  background: rgba(255, 255, 255, .035);
  animation: fadeUp .45s var(--ease) both;
}
.c-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  color: var(--faint);
  font-size: 11.5px;
}
.c-ip {
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  overflow-wrap: anywhere;
}
.c-text {
  margin: 0;
  color: var(--ink);
  font-size: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.comment-empty {
  display: none;
  margin-top: 20px;
  padding: 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--faint);
  font-size: 13.5px;
  text-align: center;
}
.comment-empty.show { display: block; }

/* ---------- cs2 ---------- */
.cs2-hero {
  position: relative;
  padding: clamp(52px, 8vw, 100px) 0 22px;
  overflow: hidden;
}
.cs2-ghost {
  position: absolute;
  right: -.04em; top: -.12em;
  z-index: 0;
  color: transparent;
  font-size: clamp(9rem, 25vw, 21rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -.09em;
  -webkit-text-stroke: 1px rgba(251, 146, 60, .10);
  user-select: none;
  pointer-events: none;
  animation: ghost 18s ease-in-out infinite alternate;
}
.cs2-hero .container { position: relative; z-index: 1; }
.cs2-hero .display {
  max-width: 11ch;
  margin: 20px 0 16px;
  font-size: clamp(2.7rem, 6.8vw, 5rem);
}
.cs2-crosshair {
  position: absolute;
  z-index: 2;
  width: 54px; height: 54px;
  margin: -27px 0 0 -27px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
.cs2-crosshair.on { opacity: .85; }
.cs2-crosshair::before,
.cs2-crosshair::after {
  content: "";
  position: absolute;
  background: #f97316;
  box-shadow: 0 0 12px rgba(249, 115, 22, .85);
}
.cs2-crosshair::before {
  left: 50%; top: 0; bottom: 0;
  width: 1px;
  transform: translateX(-.5px);
}
.cs2-crosshair::after {
  top: 50%; left: 0; right: 0;
  height: 1px;
  transform: translateY(-.5px);
}
.cs2-crosshair span {
  position: absolute;
  left: 50%; top: 50%;
  width: 14px; height: 14px;
  margin: -7px 0 0 -7px;
  border: 1px solid rgba(249, 115, 22, .8);
  border-radius: 50%;
}
.cs2-grid {
  display: grid;
  gap: 18px;
  max-width: 880px;
  margin: clamp(26px, 4vw, 44px) auto clamp(64px, 9vw, 96px);
}
.cs2-card {
  position: relative;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  padding: clamp(24px, 3.6vw, 38px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(520px 220px at 100% 0%, rgba(251, 146, 60, .10), transparent 65%),
    linear-gradient(155deg, rgba(255, 255, 255, .052), rgba(255, 255, 255, .014));
  box-shadow: 0 24px 64px -44px rgba(0, 0, 0, .95);
  transition: transform .4s var(--ease), border-color .3s, box-shadow .4s;
}
.cs2-card:hover {
  transform: translateX(6px);
  border-color: rgba(251, 146, 60, .38);
  box-shadow: 0 32px 74px -40px rgba(0, 0, 0, .98), 0 0 44px -28px rgba(251, 146, 60, .45);
}
.cs2-num {
  flex: 0 0 auto;
  padding: 5px 9px;
  border: 1px solid rgba(251, 146, 60, .32);
  border-radius: 8px;
  color: var(--a);
  font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: .14em;
}
.cs2-card p {
  margin: 0;
  color: var(--ink);
  font-size: clamp(1.02rem, 1.9vw, 1.22rem);
  line-height: 1.85;
  letter-spacing: .01em;
}
.cs2-card.big p {
  font-size: clamp(1.2rem, 2.7vw, 1.65rem);
  font-weight: 500;
  line-height: 1.7;
}
.cs2-card .quote-arrow { color: var(--a); font-weight: 900; }
.steam-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--a);
  font-weight: 800;
  border-bottom: 1px dashed rgba(251, 146, 60, .55);
  transition: color .25s, border-color .25s;
}
.steam-link:hover { color: #fde68a; border-color: #fde68a; }
.steam-link svg { width: 18px; height: 18px; flex: 0 0 18px; }
.cs2-footnote {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(880px, calc(100% - 44px));
  margin: -28px auto clamp(64px, 9vw, 96px);
  color: var(--faint);
  font-size: 12px;
  letter-spacing: .08em;
}
.cs2-footnote::before,
.cs2-footnote::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
}

/* ---------- about / cinema ---------- */
.cinema {
  position: relative;
  height: clamp(420px, calc(100svh - var(--nav-h) - 2px), 920px);
  overflow: hidden;
  background: #02040a;
  border-bottom: 1px solid var(--line);
}
.cinema video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #02040a;
}
.cinema::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(4, 7, 13, .55), transparent 24%, transparent 100%),
    radial-gradient(ellipse at center, transparent 45%, rgba(3, 5, 10, .30));
}
.cinema::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: .12;
  background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0, 0, 0, .55) 3px 4px);
}
.cinema-ui {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
.cinema-ui > * { pointer-events: auto; }
.cinema-label {
  position: absolute;
  left: clamp(18px, 4vw, 48px);
  top: clamp(18px, 4vw, 36px);
}
.cinema-label .eyebrow { background: rgba(4, 8, 16, .42); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.sound-toggle {
  position: absolute;
  right: clamp(18px, 4vw, 48px);
  top: clamp(18px, 4vw, 36px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 15px;
  border: 1px solid rgba(255, 255, 255, .20);
  border-radius: 999px;
  background: rgba(4, 8, 16, .46);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: background .25s, transform .25s;
}
.sound-toggle:hover { background: rgba(34, 211, 238, .22); transform: translateY(-1px); }
.sound-toggle svg { width: 15px; height: 15px; }
.cinema-play {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  border: 0;
  background: rgba(2, 4, 10, .24);
  cursor: pointer;
  transition: opacity .35s, visibility .35s;
}
.cinema-play.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.play-orb {
  width: clamp(68px, 9vw, 96px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .32);
  border-radius: 50%;
  background: rgba(8, 15, 28, .55);
  color: #fff;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 0 12px rgba(255, 255, 255, .045), 0 0 70px -10px rgba(34, 211, 238, .55);
  transition: transform .3s, background .3s;
}
.cinema-play:hover .play-orb { transform: scale(1.07); background: rgba(34, 211, 238, .24); }
.play-orb svg { width: 34%; height: 34%; margin-left: 6%; }
.sound-toggle svg { width: 15px; height: 15px; }
.cinema-caption {
  position: absolute;
  left: 50%;
  bottom: clamp(64px, 10vw, 92px);
  transform: translateX(-50%);
  color: rgba(255, 255, 255, .52);
  font-size: 10.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ---------- footer ---------- */
.site-footer {
  position: relative;
  z-index: 2;
  padding: clamp(30px, 5vw, 52px) 0;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(4, 7, 13, .25), rgba(4, 7, 13, .88));
}
.site-footer::before {
  content: "";
  position: absolute;
  top: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--a), var(--b), var(--c), transparent);
  opacity: .55;
}
.footer-inner {
  width: min(var(--max), calc(100% - 44px));
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.footer-brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.footer-brand::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 2px;
  background: var(--grad);
  box-shadow: 0 0 10px var(--b);
}
.footer-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px 20px;
  color: var(--muted);
  font-size: 13.5px;
}
.footer-nav a { transition: color .25s; }
.footer-nav a:hover { color: var(--ink); }
.ad-rent {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 8px;
  padding: 16px 26px;
  border: 1px solid rgba(250, 204, 21, .30);
  border-radius: 18px;
  background:
    radial-gradient(320px 120px at 50% 0%, rgba(250, 204, 21, .20), transparent 70%),
    linear-gradient(140deg, rgba(250, 204, 21, .10), rgba(251, 146, 60, .045));
  color: #fef3c7;
  font-size: clamp(1rem, 2vw, 1.17rem);
  font-weight: 800;
  letter-spacing: .02em;
  text-align: center;
  animation: adGlow 4.5s ease-in-out infinite;
}
.ad-rent a {
  color: #fde68a;
  border-bottom: 1px dashed rgba(253, 230, 138, .55);
  transition: color .25s, border-color .25s;
}
.ad-rent a:hover { color: #fff; border-color: #fff; }
.copy { margin: 0; color: var(--faint); font-size: 12px; letter-spacing: .04em; }
.copy .sep { margin: 0 8px; opacity: .5; }

/* ---------- floating UI ---------- */
.to-top {
  position: fixed;
  right: 22px; bottom: 22px;
  z-index: 120;
  width: 46px; height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: rgba(10, 16, 30, .82);
  color: var(--ink);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  pointer-events: none;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: opacity .3s, transform .3s, visibility .3s, background .25s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }
.to-top:hover { background: var(--grad); color: #051016; }
.to-top svg { width: 18px; height: 18px; }

.hidden-box {
  position: fixed;
  right: 20px;
  top: 50%;
  z-index: 100;
  width: 100px;
  height: 100px;
  background: transparent;
  cursor: pointer;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: grid;
  place-items: center;
  padding: clamp(18px, 4vw, 52px);
  background: rgba(3, 6, 12, .90);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s, visibility .3s;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lightbox figure {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: min(94vw, 1120px);
  max-height: 92vh;
  margin: 0;
  transform: scale(.94);
  transition: transform .35s var(--ease);
}
.lightbox.open figure { transform: scale(1); }
.lightbox img {
  max-width: 100%;
  max-height: 78vh;
  margin-inline: auto;
  border-radius: 16px;
  background: #0a0f1a;
  box-shadow: 0 34px 90px rgba(0, 0, 0, .65);
  object-fit: contain;
}
.lightbox figcaption { color: var(--muted); font-size: 13.5px; text-align: center; letter-spacing: .04em; }
.lb-close {
  position: absolute;
  top: clamp(16px, 3vw, 28px);
  right: clamp(16px, 3vw, 28px);
  width: 44px; height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: rgba(8, 13, 26, .72);
  color: var(--ink);
  cursor: pointer;
  transition: background .25s, transform .25s;
}
.lb-close:hover { background: var(--grad); color: #051016; transform: rotate(90deg); }
.lb-close svg { width: 18px; height: 18px; }

/* ---------- reveal / animations ---------- */
.js .reveal {
  opacity: 0;
  transform: translateY(26px);
  transition:
    opacity .8s var(--ease),
    transform .8s var(--ease);
  transition-delay: var(--d, 0ms);
}
.js .reveal.in { opacity: 1; transform: translateY(0); }

@keyframes drift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(3vw, 2vh, 0) scale(1.06); }
  100% { transform: translate3d(-2vw, 4vh, 0) scale(1.02); }
}
@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55); }
  70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
}
@keyframes sheen {
  0%, 62% { transform: translateX(-130%) rotate(10deg); }
  86%, 100% { transform: translateX(130%) rotate(10deg); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes scan {
  0% { top: -30%; }
  100% { top: 110%; }
}
@keyframes hint {
  0%, 100% { transform: scaleY(.55); opacity: .45; }
  50% { transform: scaleY(1); opacity: 1; }
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes ghost {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-2%, 1.4%, 0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes adGlow {
  0%, 100% { box-shadow: 0 0 0 rgba(250, 204, 21, 0); }
  50% { box-shadow: 0 0 46px -12px rgba(250, 204, 21, .28); }
}

/* ---------- responsive ---------- */
@media (max-width: 1024px) {
  .hero-grid { gap: 40px; }
  .guest-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .nav-shell { height: auto; flex-wrap: wrap; padding: 12px 0; gap: 10px; }
  .brand-text { font-size: 16px; }
  .nav-links { width: 100%; justify-content: space-between; }
  .nav-links a { flex: 1; padding: 8px 10px; text-align: center; font-size: 13px; }
  .hero-grid { grid-template-columns: 1fr; gap: 38px; }
  .hero-copy { text-align: left; }
  .selfie-stage { max-width: 560px; width: 100%; margin-inline: auto; }
  .scroll-hint { display: none; }
  .cinema { height: clamp(380px, calc(100svh - 150px), 760px); }
}
@media (max-width: 680px) {
  body { font-size: 15.5px; }
  .container, .nav-shell, .footer-inner { width: calc(100% - 30px); }
  .eyebrow { font-size: 9.5px; letter-spacing: .16em; }
  .display { font-size: clamp(2.55rem, 13vw, 3.7rem); }
  .page-hero .display { font-size: clamp(2.2rem, 11vw, 3rem); }
  .random-name { margin-bottom: 24px; }
  .random-name a { padding: 9px 14px; }
  .quote-card::after { right: 8px; top: -30px; font-size: 150px; }
  .quote-meta { flex-direction: column; align-items: flex-start; gap: 12px; }
  .guest-grid { grid-template-columns: 1fr; }
  .guest-media { padding: 10px 10px 0; }
  .comments { padding: 22px 18px; }
  .cs2-card { flex-direction: column; gap: 12px; }
  .cs2-card:hover { transform: translateY(-4px); }
  .cs2-hero .display { font-size: clamp(2.3rem, 12vw, 3.2rem); }
  .selfie-card { transform: none; }
  .selfie-card:hover { transform: translateY(-4px); }
  .sound-toggle svg { width: 15px; height: 15px; }
.cinema-caption { display: none; }
  .ad-rent { padding: 14px 18px; }
  .to-top { right: 14px; bottom: 14px; width: 42px; height: 42px; }
}
@media (max-width: 420px) {
  .brand-text { display: none; }
  .nav-links a { font-size: 12.5px; }
  .selfie-card { padding: 8px; border-radius: 26px; }
  .selfie-media { border-radius: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .js .reveal { opacity: 1; transform: none; }
  .cursor-glow { display: none; }
  .selfie-card { transform: none; }
}


/* ---------- comments jump + pagination ---------- */
.hero-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 22px;
}
.jump-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 11px 18px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: linear-gradient(120deg, rgba(167, 139, 250, .14), rgba(34, 211, 238, .07));
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: .01em;
  transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
}
.jump-btn:hover {
  transform: translateY(-2px);
  border-color: rgba(34, 211, 238, .55);
  box-shadow: 0 14px 34px -20px var(--b);
}
.jump-btn svg { width: 17px; height: 17px; flex: 0 0 17px; }
.jump-count {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .08);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
}
#comments { scroll-margin-top: calc(var(--nav-h) + 18px); }
.comments-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
}
.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
}
.pager button {
  min-width: 38px;
  height: 38px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255, 255, 255, .035);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: transform .2s, color .2s, background .2s, border-color .2s;
}
.pager button:hover:not(:disabled) {
  transform: translateY(-1px);
  color: var(--ink);
  border-color: var(--line-strong);
  background: rgba(255, 255, 255, .07);
}
.pager button.active {
  color: #071018;
  background: var(--grad);
  border-color: transparent;
  box-shadow: 0 8px 20px -12px var(--b);
}
.pager button:disabled { opacity: .32; cursor: not-allowed; }
.pager .pager-gap {
  padding: 0 3px;
  color: var(--faint);
  font-size: 12px;
  user-select: none;
}
.pager-info {
  color: var(--faint);
  font-size: 11.5px;
  line-height: 1.6;
  letter-spacing: .03em;
  text-align: center;
}
@media (max-width: 680px) {
  .pager button { min-width: 34px; height: 34px; padding: 0 8px; font-size: 12px; }
  .hero-actions { margin-top: 18px; }
}


/* ============================================================

   ============================================================ */
:root {
  --bg: #f8fae6;

  --ink: #2a340c;
  --muted: #626d31;
  --faint: #8a9460;
  --line: rgba(92, 105, 24, .14);
  --line-strong: rgba(92, 105, 24, .26);
  --glass: rgba(255, 255, 255, .66);
  --glass-strong: rgba(255, 255, 255, .90);
  --a: #73cd32;
  --b: #c0cd32;
  --c: #a6cd32;
  --grad: linear-gradient(110deg, var(--a), var(--b) 48%, var(--c));
  --shadow: 0 26px 60px -36px rgba(74, 86, 16, .38);
  --line-soft: rgba(92, 105, 24, .10);
}
.page-home  { --a: #73cd32; --b: #c0cd32; --c: #a6cd32; }

body { background: var(--bg); color: var(--ink); }

::-webkit-scrollbar-track { background: #f4f6e0; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--a), var(--b));
  border-color: #f4f6e0;
}
:focus-visible { outline-color: var(--a); }

.bg {
  background:
    radial-gradient(1100px 720px at 86% -12%, rgba(192, 205, 50, .30), transparent 62%),

}
.jump-btn-lg svg { width: 19px; height: 19px; flex: 0 0 19px; }

  50% { box-shadow: 0 20px 40px -18px rgba(115, 205, 50, .75), 0 0 0 7px rgba(115, 205, 50, .07), inset 0 1px 0 rgba(255, 255, 255, .45); }

/* ============================================================
   LIME THEME · #C0CD32 → #73CD32
   ============================================================ */
:root {
  --lime-1: #c0cd32;
  --lime-2: #b3cd32;
  --lime-3: #a6cd32;
  --lime-4: #99cd32;
  --lime-5: #8ccd32;
  --lime-6: #80cd32;
  --lime-7: #73cd32;
  --lime-ink: #2a340c;
  --lime-link: #4f5c0a;
  --bg: #f8fae6;
  --bg-2: #f2f7d9;
  --ink: #2a340c;
  --muted: #626d31;
  --faint: #8a9460;
  --line: rgba(92, 105, 24, .16);
  --line-strong: rgba(92, 105, 24, .28);
  --a: #80cd32;
  --b: #c0cd32;
  --c: #99cd32;
  --grad: linear-gradient(110deg, #c0cd32, #b3cd32 16%, #a6cd32 32%, #99cd32 48%, #8ccd32 64%, #80cd32 80%, #73cd32);
  --shadow: 0 26px 60px -36px rgba(63, 74, 12, .30);
}
.page-home  { --a: #80cd32; --b: #c0cd32; --c: #99cd32; }
.page-forum { --a: #80cd32; --b: #c0cd32; --c: #a6cd32; }
.page-cs2   { --a: #73cd32; --b: #b3cd32; --c: #8ccd32; }
.page-about { --a: #80cd32; --b: #c0cd32; --c: #a6cd32; }

    radial-gradient(1100px 720px at 86% -12%, rgba(192, 205, 50, .46), transparent 62%),

    radial-gradient(900px 700px at 52% 112%, rgba(166, 205, 50, .30), transparent 62%),

}
.bg::before {

    linear-gradient(rgba(92, 105, 24, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(92, 105, 24, .07) 1px, transparent 1px);
}
.orb-1 { background: radial-gradient(circle at 32% 32%, rgba(192, 205, 50, .55), transparent 66%); }
.orb-2 { background: radial-gradient(circle at 62% 38%, rgba(115, 205, 50, .45), transparent 64%); }

/* ============================================================
   SECRET ROOM · 隐藏空间
   ============================================================ */
.page-secret {
  --a: #80cd32;
  --b: #c0cd32;
  --c: #a6cd32;
}
.secret-main {
  position: relative;
  display: grid;
  place-items: center;
  min-height: calc(100svh - var(--nav-h));
  padding: clamp(38px, 7vw, 82px) 0;
  overflow: hidden;
}
.secret-wrap { position: relative; z-index: 1; }
.secret-card {
  position: relative;
  max-width: 900px;
  margin-inline: auto;
  padding: clamp(38px, 7vw, 82px) clamp(22px, 6vw, 76px);
  overflow: hidden;
  border: 1px solid rgba(92, 105, 24, .20);
  border-radius: clamp(26px, 4vw, 42px);
  background:
    radial-gradient(560px 280px at 50% -10%, rgba(192, 205, 50, .30), transparent 68%),
    radial-gradient(500px 260px at 100% 110%, rgba(140, 205, 50, .20), transparent 66%),
    linear-gradient(150deg, rgba(255, 255, 255, .94), rgba(251, 252, 234, .82));
  box-shadow: 0 34px 80px -40px rgba(63, 74, 12, .4), 0 0 0 1px rgba(255, 255, 255, .6) inset;
  text-align: center;
}
.secret-card::before {
  content: "卫";
  position: absolute;
  right: -.08em;
  bottom: -.36em;
  z-index: 0;
  color: rgba(115, 205, 50, .10);
  font-size: clamp(13rem, 30vw, 28rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -.08em;
  pointer-events: none;
  user-select: none;
}
.secret-card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(125deg, rgba(192, 205, 50, .65), transparent 34%, transparent 66%, rgba(115, 205, 50, .50));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: .75;
}
.secret-card > * { position: relative; z-index: 2; }
.secret-eyebrow { background: rgba(255, 255, 255, .75); }
.secret-title {
  margin: 26px 0 16px;
  font-size: clamp(2.25rem, 7.6vw, 6.2rem);
  font-weight: 900;
  line-height: 1.04;
  letter-spacing: -.055em;
  text-wrap: balance;
  color: var(--ink);
}
@supports ((background-clip: text) or (-webkit-background-clip: text)) {
  .secret-title {
    background: linear-gradient(100deg, #4b590a 6%, #c0cd32 30%, #8ccd32 55%, #73cd32 76%, #4b590a 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 12px 24px rgba(115, 205, 50, .20));
    animation: gradientShift 8s ease-in-out infinite;
  }
}
.secret-name {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin: 0 0 34px;
  color: var(--ink);
  font-size: clamp(1.1rem, 2.6vw, 1.55rem);
  font-weight: 800;
  letter-spacing: .32em;
}
.secret-name::before,
.secret-name::after {
  content: "";
  width: clamp(26px, 6vw, 64px);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(115, 205, 50, .7));
}
.secret-name::after { transform: scaleX(-1); }
.secret-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 24px;
  border-radius: 999px;
  background: var(--grad);
  color: #28320a;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .02em;
  box-shadow: 0 16px 34px -20px rgba(115, 205, 50, .7), inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.secret-back:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 40px -20px rgba(115, 205, 50, .8), 0 0 0 7px rgba(115, 205, 50, .09);
}
.secret-rings { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.secret-rings span {
  position: absolute;
  left: 50%;
  top: 50%;
  border: 1px dashed rgba(115, 205, 50, .22);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: spin 34s linear infinite;
}
.secret-rings span:nth-child(1) { width: 340px; height: 340px; }
.secret-rings span:nth-child(2) { width: 520px; height: 520px; animation-duration: 48s; animation-direction: reverse; }
.secret-rings span:nth-child(3) { width: 720px; height: 720px; animation-duration: 64s; }
.secret-spark {
  position: absolute;
  left: var(--x);
  top: var(--y);
  z-index: 1;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #a6cd32;
  box-shadow: 0 0 14px rgba(115, 205, 50, .65);
  opacity: .35;
  animation: sparkFloat 6s ease-in-out infinite;
  animation-delay: var(--d);
  pointer-events: none;
}
@keyframes sparkFloat {
  0%, 100% { transform: translateY(0) scale(.7); opacity: .2; }
  50% { transform: translateY(-16px) scale(1); opacity: .8; }
}
@media (max-width: 680px) {
  .secret-card { padding: 40px 20px 42px; }
  .secret-title { margin: 22px 0 14px; }
  .secret-name { margin-bottom: 28px; letter-spacing: .24em; }
  .secret-rings span:nth-child(1) { width: 280px; height: 280px; }
  .secret-rings span:nth-child(2) { width: 420px; height: 420px; }
  .secret-rings span:nth-child(3) { display: none; }
}


/* secret page: always visible, name on its own line */
.secret-card {
  animation: secretIn .7s var(--ease) both;
}
@keyframes secretIn {
  from { opacity: 0; transform: translateY(18px) scale(.985); }
  to { opacity: 1; transform: none; }
}
.secret-name {
  display: flex;
  justify-content: center;
  width: fit-content;
  margin-inline: auto;
}

/* static halo: the rotating decorative box was causing mobile horizontal overflow */
.selfie-halo { animation: none; }

/* keep secret rings centered while slowly rotating */
.secret-rings span { animation: ringSpin 34s linear infinite; }
@keyframes ringSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }

<script>
(function () {
  'use strict';

  var root = document.documentElement;
  root.classList.remove('no-js');
  root.classList.add('js');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

  /* ---------- scroll reveal ---------- */
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !reduceMotion) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('in'); });
  }

  /* ---------- progress bar + back to top ---------- */
  var bar = document.getElementById('scrollProgress');
  var toTop = document.getElementById('toTop');
  var scrollQueued = false;

  function paintScroll() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var y = window.pageYOffset || doc.scrollTop || 0;
    if (bar) { bar.style.width = (max > 0 ? Math.min(100, (y / max) * 100) : 0) + '%'; }
    if (toTop) { toTop.classList.toggle('show', y > 560); }
    scrollQueued = false;
  }
  function onScroll() {
    if (!scrollQueued) {
      scrollQueued = true;
      window.requestAnimationFrame(paintScroll);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  paintScroll();

  if (toTop) {
    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });
  }

  /* ---------- lightbox ---------- */
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightboxImg');
  var lbCaption = document.getElementById('lightboxCaption');
  var lbClose = document.getElementById('lightboxClose');
  var lastFocus = null;

  function openLightbox(src, caption) {
    if (!lb || !lbImg) { return; }
    lastFocus = document.activeElement;
    lbImg.src = src;
    lbImg.alt = caption || '';
    if (lbCaption) { lbCaption.textContent = caption || ''; }
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (lbClose) { lbClose.focus(); }
  }
  function closeLightbox() {
    if (!lb) { return; }
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
  }

  document.addEventListener('click', function (event) {
    var zoom = event.target.closest ? event.target.closest('[data-zoom]') : null;
    if (zoom) {
      event.preventDefault();
      var full = zoom.getAttribute('data-full') || zoom.getAttribute('href') || '';
      if (full) { openLightbox(full, zoom.getAttribute('data-caption') || ''); }
      return;
    }
    if (lb && lb.classList.contains('open')) {
      if (event.target === lb) { closeLightbox(); }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && lb && lb.classList.contains('open')) { closeLightbox(); }
  });

  if (lbClose) {
    lbClose.addEventListener('click', function () { closeLightbox(); });
  }

  /* ---------- cursor glow ---------- */
  var glow = document.getElementById('cursorGlow');
  if (glow && finePointer && !reduceMotion) {
    document.body.classList.add('has-pointer');
    var gx = window.innerWidth / 2;
    var gy = window.innerHeight / 3;
    var glowQueued = false;
    function paintGlow() {
      glow.style.transform = 'translate3d(' + gx + 'px,' + gy + 'px,0)';
      glowQueued = false;
    }
    window.addEventListener('pointermove', function (event) {
      gx = event.clientX;
      gy = event.clientY;
      if (!glowQueued) {
        glowQueued = true;
        window.requestAnimationFrame(paintGlow);
      }
    }, { passive: true });
    paintGlow();
  }

  /* ---------- subtle 3d tilt ---------- */
  if (finePointer && !reduceMotion) {
    document.querySelectorAll('[data-tilt]').forEach(function (card) {
      var strength = 6;
      card.addEventListener('pointermove', function (event) {
        if (event.pointerType && event.pointerType !== 'mouse') { return; }
        var rect = card.getBoundingClientRect();
        var px = (event.clientX - rect.left) / rect.width - 0.5;
        var py = (event.clientY - rect.top) / rect.height - 0.5;
        card.classList.add('tilting');
        card.style.setProperty('--rx', (-py * strength).toFixed(2) + 'deg');
        card.style.setProperty('--ry', (px * strength).toFixed(2) + 'deg');
      });
      card.addEventListener('pointerleave', function () {
        card.classList.remove('tilting');
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
      });
    });
  }

  /* ---------- broken image fallback ---------- */
  document.addEventListener('error', function (event) {
    var img = event.target;
    if (img && img.tagName === 'IMG' && img.closest) {
      var card = img.closest('.guest-card');
      if (card) { card.classList.add('img-failed'); }
    }
  }, true);

  /* failed / stalled external avatars fall back to their initials */
  window.setTimeout(function () {
    document.querySelectorAll('.profile-link > img').forEach(function (img) {
      if (!img.naturalWidth) {
        var card = img.closest('.guest-card');
        if (card) { card.classList.add('img-failed'); }
      }
    });
  }, 2600);
})();

</script>

<script>
(function () {
  'use strict';
  var audio = document.getElementById('cs2Music');
  var btn = document.getElementById('musicToggle');
  var label = document.getElementById('musicLabel');
  if (!audio || !btn) { return; }
  audio.volume = 0.7;
  var errorHandled = false;

  function sync() {
    var playing = !audio.paused && !audio.ended;
    btn.classList.toggle('is-playing', playing);
    btn.setAttribute('aria-pressed', String(playing));
    btn.setAttribute('aria-label', playing ? '暂停音乐：老男孩（DJ混音版）' : '播放音乐：老男孩（DJ混音版）');
    if (label) { label.textContent = playing ? '暂停音乐' : '播放音乐'; }
  }

  function playMusic() {
    var promise = audio.play();
    if (promise && promise.catch) {
      promise.catch(function () { sync(); });
    }
  }

  btn.addEventListener('click', function () {
    if (audio.paused) { playMusic(); } else { audio.pause(); }
  });
  audio.addEventListener('play', sync);
  audio.addEventListener('pause', sync);
  audio.addEventListener('ended', sync);
  audio.addEventListener('error', function () {
    if (errorHandled) { return; }
    errorHandled = true;
    btn.disabled = true;
    if (label) { label.textContent = '音乐加载失败'; }
  });

  /* try to autoplay; if the browser blocks it, the button is the fallback */
  window.setTimeout(playMusic, 300);
  sync();
})();
</script>
